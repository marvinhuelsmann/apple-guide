      <stop offset="0" stop-color="#0d2b4c"/><stop offset="0.55" stop-color="#5aa9ff"/><stop offset="1" stop-color="#e6f3ff"/>
    </linearGradient>
    <radialGradient id="airpods-max-usb-c-glow" cx="0.3" cy="0.75" r="0.6">
