<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" fill="none">
  <defs>
    <linearGradient id="homepod-1-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/><stop offset="0.55" stop-color="#7d8aa6"/><stop offset="1" stop-color="#e6e9f2"/>
    </linearGradient>
    <radialGradient id="homepod-1-glow" cx="0.3" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#e6e9f2" stop-opacity="0.9"/><stop offset="1" stop-color="#e6e9f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="homepod-1-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="homepod-1-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    
    <linearGradient id="homepod-1-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f4f2"/><stop offset="0.5" stop-color="#e0e0dd"/><stop offset="1" stop-color="#c4c4c0"/>
    </linearGradient>
    <pattern id="homepod-1-mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#9a9a97" fill-opacity="0.55"/>
    </pattern>
  </defs>
    <ellipse cx="400" cy="820" rx="230" ry="26" fill="#000" fill-opacity="0.3" filter="url(#homepod-1-shadow)"/>
    <rect x="190" y="120" width="420" height="690" rx="200" fill="url(#homepod-1-metal)"/>
    <rect x="190" y="120" width="420" height="690" rx="200" fill="url(#homepod-1-mesh)"/>
    <ellipse cx="400" cy="150" rx="156" ry="50" fill="#2a2a2e"/>
    <ellipse cx="400" cy="150" rx="120" ry="36" fill="url(#homepod-1-screen)" opacity="0.95"/>
    <ellipse cx="400" cy="150" rx="120" ry="36" fill="url(#homepod-1-glow)"/>
    <ellipse cx="400" cy="150" rx="156" ry="50" fill="url(#homepod-1-shine)" opacity="0.5"/></svg>