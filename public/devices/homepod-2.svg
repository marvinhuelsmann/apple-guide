<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" fill="none">
  <defs>
    <linearGradient id="homepod-2-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4b"/><stop offset="0.55" stop-color="#2f6df6"/><stop offset="1" stop-color="#9ad0ff"/>
    </linearGradient>
    <radialGradient id="homepod-2-glow" cx="0.3" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#9ad0ff" stop-opacity="0.9"/><stop offset="1" stop-color="#9ad0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="homepod-2-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="homepod-2-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    
    <linearGradient id="homepod-2-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4150"/><stop offset="0.5" stop-color="#232834"/><stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <pattern id="homepod-2-mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#0a0b0e" fill-opacity="0.55"/>
    </pattern>
  </defs>
    <ellipse cx="400" cy="820" rx="230" ry="26" fill="#000" fill-opacity="0.3" filter="url(#homepod-2-shadow)"/>
    <rect x="190" y="120" width="420" height="690" rx="200" fill="url(#homepod-2-metal)"/>
    <rect x="190" y="120" width="420" height="690" rx="200" fill="url(#homepod-2-mesh)"/>
    <ellipse cx="400" cy="150" rx="156" ry="50" fill="#0f1013"/>
    <ellipse cx="400" cy="150" rx="120" ry="36" fill="url(#homepod-2-screen)" opacity="0.95"/>
    <ellipse cx="400" cy="150" rx="120" ry="36" fill="url(#homepod-2-glow)"/>
    <ellipse cx="400" cy="150" rx="156" ry="50" fill="url(#homepod-2-shine)" opacity="0.5"/></svg>